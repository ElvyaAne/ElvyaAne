name: Redraw the range
on:
  schedule:
    # every 6 hours, so the README never lags LeetCode by more than a few hours
    - cron: "17 */6 * * *"
  push:
    # redraw right away when the numbers, the script or the fonts are edited by hand
    branches: [main]
    paths: [last-stats.json, range.js, fonts.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: range
  cancel-in-progress: false
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node range.js
      - name: Commit if the range changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "range-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add range.svg last-stats.json
            git commit -m "Redraw the range"
            git pull --rebase
            git push
          fi
