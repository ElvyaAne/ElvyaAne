name: Redraw the range
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node range.js
      - name: Commit if the range changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "range-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add range.svg last-stats.json
            git commit -m "Redraw the range"
            git push
          fi
